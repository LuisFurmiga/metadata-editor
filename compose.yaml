services:
  metadata-editor:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: metadata-editor

    ports:
      - "8000:8000"

    environment:
      TZ: UTC
      METADATA_MAX_UPLOAD_SIZE: "262144000"
      METADATA_SESSION_TTL_SECONDS: "86400"
      METADATA_EXIFTOOL_BINARY: "/opt/exiftool/exiftool"
      METADATA_WORKSPACE_ROOT: "/tmp/metadata-editor/sessions"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/python3.12",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
